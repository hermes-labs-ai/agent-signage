name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      - name: Selftest
        run: agent-signage selftest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke test the installed wheel
        run: |
          python -m venv /tmp/agent-signage-wheel
          /tmp/agent-signage-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/agent-signage-wheel/bin/agent-signage selftest

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: signage
        uses: ./
        with:
          body-file: examples/preflight-contribution.md
          kind: contribution
          oversight: none

      - name: Assert checked-body digest
        env:
          BODY_SHA256: ${{ steps.signage.outputs.body_sha256 }}
        run: test "$BODY_SHA256" = "f5c5f1c635a598d389af0be378f2b1424d6b2d131b8ce4a3b986106abd44d51f"
