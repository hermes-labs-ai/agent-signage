name: Publish to PyPI

# PyPI trusted publishing: GitHub exchanges the job's OIDC identity for a
# short-lived, project-scoped upload token. No long-lived PyPI secret is used.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-signage
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      # PyPI runs this on upload anyway. Failing here gives a readable error
      # instead of a rejected upload after the fact.
      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
