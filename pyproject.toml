[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-signage"
version = "0.0.8"
description = "Road signs for coding agents: one true fact at the moment of action, silence otherwise"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "Hermes Labs", email = "roli@hermes-labs.ai"}]
keywords = [
    "ai-agents", "claude-code", "agent-harness", "hooks", "developer-tools",
    "git", "stale-branch", "agent-reliability", "context-integrity",
    "guardrails", "agentic", "zero-llm", "pretooluse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hermes-labs-ai/agent-signage"
Source = "https://github.com/hermes-labs-ai/agent-signage"
Issues = "https://github.com/hermes-labs-ai/agent-signage/issues"

[project.scripts]
agent-signage = "agent_signage.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_signage"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
