[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-signage"
version = "0.1.2"
description = "Road signs for coding agents: one true fact at the moment of action, silence otherwise"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "Hermes Labs", email = "roli@hermes-labs.ai"}]
keywords = [
    "ai-agents", "claude-code", "agent-harness", "hooks", "developer-tools",
    "git", "stale-branch", "agent-reliability", "context-integrity",
    "guardrails", "agentic", "zero-llm", "pretooluse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hermes-labs-ai/agent-signage"
Source = "https://github.com/hermes-labs-ai/agent-signage"
Issues = "https://github.com/hermes-labs-ai/agent-signage/issues"

[project.scripts]
agent-signage = "agent_signage.__main__:main"

[project.optional-dependencies]
# Ruff's enabled rule set is pinned explicitly below; the compatible tool
# version may advance without silently changing which rules CI enforces.
dev = ["pytest>=7", "ruff>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_signage"]

# py.typed is a promise to type checkers and has to be in the installed wheel,
# not just the repo. Without it, `Typing :: Typed` above is a false claim and
# every import from this package resolves to Any in a checked project.
[tool.hatch.build.targets.wheel.force-include]
"src/agent_signage/py.typed" = "agent_signage/py.typed"

# Allow-list, not a deny-list. 0.1.0's sdist shipped a directory of internal
# notes because the default is "everything not gitignored"; naming what belongs
# means a new stray file cannot ride along by default.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/scripts",
  # tests/test_preflight.py executes evals/preflight-matrix.json, so the sdist
  # cannot run its own suite without it.
  "/evals",
  "/claude-plugin",
  "/.github",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/CITATION.cff",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py39"

# Selected explicitly, not inherited. Ruff's default rule set widens between
# releases, so an unpinned dev dependency would silently change what CI
# enforces and break a fresh clone that resolves a newer ruff than the last
# contributor had. Pinning the tool would only defer that; pinning the rules
# fixes it.
[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, warnings, import order
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
